[project]
name = "illmined"
version = "0.1.0"
description = "Training-free asymmetric dynamic sparsity and inference acceleration for on-device LLMs on Apple Silicon (MLX + Metal)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4.8.5",
    "mlx>=0.31.2",
    "mlx-lm>=0.31.3",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    "transformers>=5.8.1",
]
